<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Khatu Universal Master Dashboard</title>
<style>:root{padding-top:env(safe-area-inset-top,0)}[hidden]{display:none!important}
:root{--ac:#1d4ed8;--tint:#eef3ff;--tx:#0f1b3d;--mute:#5a6b8c;--ok:#15803d;--bad:#dc2626;--glass:rgba(255,255,255,.88);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--tx);font:15px/1.55 system-ui,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;min-width:720px}
nav{position:sticky;top:0;z-index:2;height:100vh;background:#000;border-right:3px solid var(--ac);display:flex;flex-direction:column;overflow:auto}
nav button{all:unset;display:block;padding:11px 16px 11px 28px;cursor:pointer;color:#c3cde0;border-bottom:1px solid #2a2a2a;transition:background .15s,color .15s}
nav button.sub{padding-left:48px;border-bottom:1px dotted #3a3a3a;font-size:14px}
nav button.grp{color:#fff;border-bottom:1px solid var(--ac);border-top:1px solid var(--ac);margin-top:6px;font-weight:600}nav button.grp i{float:right;font-style:normal}
nav button:hover{background:#111;color:#fff}nav button.on{background:var(--ac);color:#fff}
#drive{--lv:#22c55e;margin-top:auto;border-top:2px solid var(--ac);padding:14px 16px;color:#fff;font-size:12px}
#drive.mid{--lv:#eab308}#drive.hi{--lv:#ef4444}
#drive .top{display:flex;justify-content:space-between;align-items:baseline}#drive small{color:#8fb0ff}
#drive b{display:inline;padding:0;border:0;font-size:14px}
#drive .pct{font-size:20px;font-weight:700;color:var(--lv);font-variant-numeric:tabular-nums}
.meter{height:7px;background:#262626;border-radius:4px;overflow:hidden;margin:8px 0}.meter span{display:block;height:100%;background:var(--lv);transition:width .6s,background .3s}
#drive dl{display:grid;grid-template-columns:auto auto;gap:3px 10px;margin:0 0 8px;border-top:1px solid #333;padding-top:8px}#drive dt{color:#8ea0bd}#drive dd{margin:0;text-align:right}
.who{display:block;color:#8ea0bd;word-break:break-all;border-top:1px solid #333;padding-top:8px}
section{position:relative;z-index:1;padding:32px 40px;overflow:auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px}
h2{margin:0;font-size:32px;letter-spacing:-.5px}.head p{margin:2px 0 0;color:var(--mute)}h3{margin:0 0 12px;font-size:17px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--tint);color:var(--ac);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-bottom:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.kpi,.panel{background:var(--glass);backdrop-filter:blur(6px);border-radius:18px;padding:20px 22px;box-shadow:0 8px 28px rgba(29,78,216,.10)}
.kpi{background:linear-gradient(135deg,rgba(226,235,255,.95),rgba(255,255,255,.8))}
.kpi b{display:block;font-size:34px;line-height:1.15;color:var(--ac)}.kpi b.ok{color:var(--ok)}.kpi b.bad{color:var(--bad)}.kpi span{color:var(--mute)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--glass);border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(29,78,216,.10)}
th,td{padding:13px 18px;text-align:left}th{background:#e3ecff;color:var(--ac);font-weight:600}
tr:nth-child(even) td{background:rgba(238,243,255,.6)}tr:hover td{background:#dfe9ff}
input,select,textarea{background:var(--tint);border:0;color:var(--tx);padding:11px 14px;border-radius:12px;font:inherit}
button.b{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:0;padding:11px 20px;border-radius:12px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(29,78,216,.3)}
button.s{background:var(--tint);border:0;color:var(--ac);padding:6px 14px;border-radius:10px;font-weight:600;cursor:pointer}button.s:hover{background:#dbe6ff}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:10px;background:linear-gradient(90deg,#60a5fa,#1d4ed8);border-radius:6px}small{color:var(--mute)}a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Logo watermark: white screen only, 20% opacity; the red dot circles the infinity every 5 seconds */
#wm{position:fixed;left:250px;right:0;top:0;bottom:0;display:grid;place-items:center;pointer-events:none;z-index:0}
#wm .box{position:relative;width:min(72%,860px);aspect-ratio:3/2}
#wm img{width:100%;height:100%;object-fit:contain;opacity:.2;mix-blend-mode:multiply}
#wm svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}@keyframes grow{from{width:0}}@keyframes pulse{50%{opacity:.3}}
#view.enter>*{animation:rise .3s ease-out both}#view.enter .bar{animation:grow .7s ease-out}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
#consent{position:fixed;inset:0;z-index:9000;background:rgba(15,27,61,.5);display:grid;place-items:center;padding:16px}
#consent .card{background:#fff;color:var(--tx);border-radius:18px;padding:24px;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(15,27,61,.35);animation:rise .25s ease-out}
#consent h3{margin:0 0 8px}#consent p,#consent ol{color:var(--mute);margin:0 0 14px}#consent ol{padding-left:20px}
#phone{display:grid;place-content:center;gap:8px;min-height:100vh;padding:24px;text-align:center}#phone h1{margin:0;color:var(--ac)}#phone p{margin:0;color:var(--mute);max-width:420px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.brand{display:flex;align-items:center;gap:14px;padding:22px 16px 20px 38px;border-bottom:2px solid var(--ac);background:linear-gradient(180deg,#0b1430,#000)}
.brand svg{width:52px;height:28px;filter:drop-shadow(0 0 7px rgba(59,130,246,.75))}
.brand strong{display:block;color:#fff;font-size:25px;font-weight:800;letter-spacing:6px;line-height:1}
.brand em{display:block;font-style:normal;color:#ff4d3d;font-size:11px;font-weight:700;letter-spacing:8px;margin-top:6px}
.brand small{display:block;color:#7d8aa5;font-size:8.5px;letter-spacing:1.2px;margin-top:6px;white-space:nowrap}
.stack{display:grid;gap:10px}.stack textarea{resize:vertical}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--ac);font-weight:700;margin-right:10px}
.dots{text-align:right;width:60px}.dot{all:unset;cursor:pointer;font-size:20px;line-height:1;padding:2px 10px;border-radius:8px;color:var(--mute)}.dot:hover{background:#dbe6ff;color:var(--ac)}
#menu{position:fixed;z-index:8000;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(15,27,61,.22);padding:6px;min-width:180px;display:grid;animation:rise .15s ease-out}
#menu button{all:unset;padding:9px 14px;border-radius:8px;cursor:pointer}#menu button:hover{background:var(--tint)}#menu .bad{color:var(--bad)}
.tag{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}.tag.sent{background:#dbe6ff;color:var(--ac)}.tag.received{background:#dcfce7;color:var(--ok)}
button.s.on{background:var(--ac);color:#fff}
.pill .clock{font-variant-numeric:tabular-nums}
#consent p{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.tool{background:var(--glass);backdrop-filter:blur(6px);border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(29,78,216,.10);display:grid;gap:14px;transition:transform .2s,box-shadow .2s}
.tool:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(29,78,216,.18)}.tool.disabled{opacity:.7}
.tt{display:flex;align-items:center;gap:12px}.tt div{flex:1;min-width:0}.tt b{display:block}.tt small{display:block}
.tt .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;font-weight:700;font-size:20px;margin:0}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px}
.badge{padding:3px 12px;border-radius:999px;font-weight:600;font-size:12px;background:#e6f6ec;color:var(--ok)}.badge.warn{background:#fef3c7;color:#a16207}.badge.bad{background:#fee2e2;color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--tint);border-radius:12px;padding:3px}
.seg button{all:unset;text-align:center;padding:7px 0;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mute)}.seg button.on{background:#fff;color:var(--ac);box-shadow:0 2px 8px rgba(29,78,216,.18)}.seg button:disabled{cursor:default}
.links{display:flex;gap:16px;font-size:13px;color:var(--mute)}.links a{font-weight:600;text-decoration:none}
.chart{width:100%;height:auto}.chart text{font:11px system-ui;fill:#5a6b8c}.chart .ln{fill:none;stroke:#1d4ed8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut text{font:12px system-ui;fill:#5a6b8c}.legend div{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}.legend i{width:10px;height:10px;border-radius:3px}
.split{display:flex;height:12px;border-radius:7px;overflow:hidden;margin:10px 0}.split span{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;gap:8px;background:var(--tint);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}.chip i{width:8px;height:8px;border-radius:50%}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:18px}.wide{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;margin-bottom:18px}
.statrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0}.statrow b{font-variant-numeric:tabular-nums}
.go{all:unset;float:right;color:var(--ac);font-weight:600;font-size:13px;cursor:pointer}
@keyframes draw{to{stroke-dashoffset:0}}
#view.enter .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}
.brow{display:grid;grid-template-columns:116px 1fr 44px;align-items:center;gap:10px;margin:10px 0;font-size:14px}.brow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brow b{text-align:right;font-variant-numeric:tabular-nums}.trk{overflow:hidden}
.official{display:flex;align-items:center;gap:18px;margin-bottom:18px}.official div{flex:1}.official small{display:block}.official b{display:block;font-size:19px;color:var(--ac)}.official span:not(.badge){color:var(--mute);font-size:14px}
#drive{padding:9px 12px;font-size:11px}#drive .pct{font-size:14px}#drive b{font-size:12px}.meter{height:5px;margin:6px 0}
#drive .ln2{display:flex;justify-content:space-between;align-items:center;gap:6px;color:#8ea0bd;margin:3px 0;white-space:nowrap}#drive .ln2 span:first-child{overflow:hidden;text-overflow:ellipsis;color:#c3cde0}
#drive button{all:unset;color:#6ea0ff;cursor:pointer;font-weight:600}#drive .who{padding-top:5px;margin-top:5px;font-size:10px}

/* Login, welcome, folder gate */
#login{display:grid;grid-template-columns:minmax(380px,46%) 1fr;min-height:100vh;background:#fff}
.lside{position:relative;overflow:hidden;background:linear-gradient(160deg,#2563eb 0%,#1d4ed8 45%,#172c8f 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:44px 32px;gap:28px}
.lside::before,.lside::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}.lside::before{width:380px;height:380px;right:-140px;top:-120px}.lside::after{width:300px;height:300px;left:-120px;bottom:-100px}
.lside h1{margin:0;font-size:36px;font-weight:800;letter-spacing:3px;text-transform:uppercase;z-index:1;text-align:center}
.lcard{background:#fff;border-radius:26px;padding:18px;box-shadow:0 24px 60px rgba(8,20,80,.45);width:min(460px,100%);z-index:1;animation:rise .6s ease-out}.lcard img{display:block;width:100%;height:auto}
.tag{margin:0;letter-spacing:6px;font-weight:600;font-size:14px;color:#dbe7ff;z-index:1;text-align:center}
#lf{align-self:center;justify-self:center;width:min(400px,86%);display:grid;gap:14px;animation:rise .5s ease-out}#lf h2{margin:0;font-size:30px}#lf p{margin:0 0 8px;color:var(--mute)}
#lf label{display:grid;gap:6px;font-weight:600;font-size:13px;color:#33436b}#lf input{padding:13px 16px;font-size:15px}
#lf button{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(29,78,216,.35)}#err{color:var(--bad);min-height:18px}
@media (max-width:820px){#login{grid-template-columns:1fr}.lside{padding:28px 20px}}
#welcome{position:fixed;inset:0;z-index:12000;background:linear-gradient(165deg,#ff9a2e,#ff6a00 60%,#e85500);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;cursor:pointer;overflow:hidden;transition:opacity .45s}
#welcome.out{opacity:0}#welcome h1{margin:14px 0 0;font-size:clamp(28px,4vw,46px);font-weight:800;animation:rise .7s .3s both}#welcome p{margin:0;font-size:clamp(18px,2.2vw,26px);opacity:.95;animation:rise .7s .5s both}
#welcome small{margin-top:26px;opacity:.85;letter-spacing:1px}#welcome i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.7;animation:twinkle 2.4s infinite}
.rocket{animation:launch 1.1s ease-out both,hover 2.2s 1.1s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(120,40,0,.35))}.rocket .flame{transform-origin:60px 128px;animation:flame .18s ease-in-out infinite alternate}
@keyframes launch{from{transform:translateY(120px) scale(.9);opacity:0}to{transform:none;opacity:1}}@keyframes hover{50%{transform:translateY(-14px) rotate(2deg)}}@keyframes flame{from{transform:scaleY(.85)}to{transform:scaleY(1.2)}}@keyframes twinkle{50%{opacity:.1}}
#gate{position:fixed;inset:0;z-index:11000;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 500px at 80% 0%,rgba(37,99,235,.14),transparent 60%),#f4f8ff}
.gcard{background:#fff;border-radius:22px;padding:32px;max-width:480px;box-shadow:0 20px 60px rgba(29,78,216,.18);text-align:center;animation:rise .35s ease-out}.gcard h2{margin:10px 0 8px}.gcard p{color:var(--mute);margin:0 0 14px}.gcard .row{justify-content:center}.gcard .gname{color:var(--tx);font-weight:600}.gcard .gmsg{color:var(--bad)}
/* Theme polish and charts */
body{background:radial-gradient(1000px 420px at 88% -8%,rgba(37,99,235,.09),transparent 62%),radial-gradient(700px 380px at -5% 105%,rgba(14,165,233,.07),transparent 60%),#fff;background-attachment:fixed}
.kpi{position:relative;overflow:hidden;padding-right:68px;transition:transform .2s,box-shadow .2s}.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(29,78,216,.16)}
.ic{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#60a5fa);box-shadow:0 8px 18px rgba(37,99,235,.35)}.ic svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}.chead h3{margin:0}.pill.soft{background:#eef3ff;padding:5px 12px}
.cstats{display:flex;gap:26px;margin:6px 0 4px}.cstats div{display:grid}.cstats b{font-size:24px;line-height:1.2;color:var(--ac);font-variant-numeric:tabular-nums}.cstats small{color:var(--mute)}
.chartbox{position:relative}.chart .halo{fill:#fff;stroke:#1d4ed8;stroke-width:4;opacity:0;transition:opacity .15s;filter:drop-shadow(0 0 8px rgba(29,78,216,.6))}.chart .ln{filter:drop-shadow(0 6px 8px rgba(29,78,216,.35))}
.chart .pulse{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}@keyframes ping{from{transform:scale(1);opacity:.5}to{transform:scale(3.2);opacity:0}}
.tip{position:absolute;transform:translateX(-50%);background:#0f1b3d;color:#fff;padding:6px 11px;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 8px 20px rgba(15,27,61,.3)}
.donut circle{transition:stroke-width .2s}.donut circle:hover{stroke-width:24}.legend small{color:var(--mute)}
nav button{display:flex;align-items:center;gap:12px}nav button svg{flex:none;opacity:.85}nav button.grp{display:block}nav button.sub svg{width:15px;height:15px}
#welcome small{color:#fff}
.prog{height:9px;background:var(--tint);border-radius:6px;overflow:hidden;margin:16px 0 10px}.prog span{display:block;height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#1d4ed8);animation:fillbar linear forwards}
@keyframes fillbar{to{width:100%}}
td.dots{text-align:right;white-space:nowrap}
.arow{display:flex;align-items:center;gap:12px;padding:9px 0}.arow>div{flex:1;min-width:0}.arow b{display:block}.arow small{display:block;color:var(--mute)}
.av2{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;font-weight:700}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--mute);background:var(--tint);padding:5px 13px;border-radius:999px;white-space:nowrap}.st i{width:8px;height:8px;border-radius:50%;background:#9aa8c2}
.st.on{color:var(--ok);background:#e6f6ec}.st.on i{background:var(--ok);animation:pulse 1.6s infinite}
.arow b small{display:inline;margin-left:6px}#view>.panel{margin-bottom:18px}

const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp() { // one-time number count-up when a tab opens
  if (!fresh) return; fresh = false; if (calm) return;
  document.querySelectorAll('.kpi b').forEach(b => { const n = +b.textContent; if (!(n >= 1)) return; const t0 = performance.now();
    (function f(t) { const p = Math.min(1, (t - t0) / 700); b.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); })(t0); });
}
const SUB = { Overview: 'Live view of the whole Khatu Universal ecosystem', Software: 'Switch, add and link every software', Members: 'Everyone in the Khatu Universal family', Mail: 'Send mail and track what came in and went out', 'Mail Send': 'Send mail automatically, now or on a schedule', Finance: 'Money coming in and going out', Permissions: 'Where your data is saved, and what this device may do' };
const stamp = () => { const d = new Date(); return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + ' · ' + d.toLocaleTimeString(); };
const tickClock = () => document.querySelectorAll('.clock').forEach(c => c.textContent = stamp());
const head = t => `<div class="head"><div><h2>${t}</h2><p>${SUB[t]}</p></div><span class="pill"><i class="live"></i><span class="clock">${stamp()}</span></span></div>`;
const view = h => { $('#view').innerHTML = h; countUp(); };
// Desktop and tablet only: phones see a notice (device type, not window size, so narrow windows still work)
const isPhone = navigator.userAgentData?.mobile === true || /Android.*Mobile|iPhone|iPod|Windows Phone/i.test(navigator.userAgent);
if (isPhone) $('#phone').hidden = false; else start();

if (calm) document.querySelectorAll('#wm circle').forEach(c => c.remove()); // reduced motion: no moving dot
</script></body></html>
