<title>KHATU STUDY LAB</title>
<style>
/* Theme follows the phone/PC setting automatically (light or dark) */
:root{
  --bg:#f5f6fb;--surface:#fff;--surface2:#e9ecf8;--text:#161a33;--muted:#5d6486;--line:#d8dcee;
  --brand:#3f51d9;--brand-ink:#fff;--gold:#a15c00;--gold-bg:#fff0d1;--acc:#f59e0b;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Devanagari",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1024;--surface:#161a35;--surface2:#20264a;--text:#eceefc;--muted:#9aa2cf;--line:#2c3360;
  --brand:#8d9bff;--brand-ink:#0d1024;--gold:#f7b955;--gold-bg:#33270f}
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ico{flex:none;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flt{50%{transform:translateY(-2px)}}
@keyframes pls{50%{transform:scale(1.12)}}
.a-spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
.a-float{transform-box:fill-box;transform-origin:center;animation:flt 2s ease-in-out infinite}
.a-pulse{transform-box:fill-box;transform-origin:center;animation:pls 1.9s ease-in-out infinite}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
.brand{flex:none;min-width:150px}
.hpath{flex:1;display:flex;align-items:center;gap:10px;margin-left:22px}
.brand b{display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.go{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip.up{background:var(--acc);color:#2b1a00;border-color:var(--acc)}

/* layout (mode classes on body) */
.shell{margin:0 auto}
body.mobile .shell,body.mobile .top{max-width:430px;margin-inline:auto}
body.mobile .shell{min-height:100vh;border-inline:1px solid var(--line)}
body.guest nav{display:none}
body.guest .shell{display:block;max-width:480px}
body.guest #upg,body.guest #walBtn{display:none}
button.logo{border:0;padding:0;overflow:hidden;cursor:pointer}
body:not(.guest) button.logo{background:none}
nav{display:flex;gap:2px}
nav button{background:none;border:0;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
nav button[aria-current="page"]{color:var(--brand)}
nav button[aria-current="page"] .ico{animation:pls 1.9s ease-in-out infinite}
body.mobile nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);z-index:25;background:var(--surface);
  border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
body.mobile nav button{flex-direction:column;gap:2px;font-size:11px;padding:4px 10px}
main{padding:16px 16px 100px;min-width:0}
h1{font-size:22px;margin:0 0 4px;line-height:1.25}
h2{font-size:17px;margin:26px 0 12px}
.sub{color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
body.mobile .grid.two{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--text)}
.stat b{font-size:24px;display:flex;align-items:center;gap:8px}
.stat span{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.hero{background:var(--brand);color:var(--brand-ink);border:0;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hero p{margin:2px 0 0;opacity:.9}
.hero .chip{margin-left:auto;background:var(--acc);border-color:var(--acc);color:#2b1a00}
.row2{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--brand)}
.meta{flex:1;min-width:0}
.meta small,.tool p{color:var(--muted);font-size:13px;margin:0}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag.free{background:var(--surface2);color:var(--brand)}
.tag.pro{background:var(--gold-bg);color:var(--gold)}
.locked{border-color:var(--acc)}
.check{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.check label{flex:1;cursor:pointer}
.check.done label{color:var(--muted);text-decoration:line-through}

/* video */
.tabs{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* login */
.login{margin-top:24px}
.fld{display:block;margin:12px 0 0;font-weight:600;font-size:14px}
.fld input{display:block;width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.fld select{display:block;width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:inherit;color:inherit}
.fld[hidden],#ufw[hidden]{display:none}
.wave{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden}
.wave .wv{position:absolute;top:-8%;bottom:-8%;left:0;width:160%;background:linear-gradient(90deg,rgba(22,163,74,0) 0,#16a34a 16%,#22c55e 50%,#16a34a 84%,rgba(22,163,74,0) 100%);animation:wvsweep 1.5s cubic-bezier(.65,0,.35,1) forwards}
.wave .wt{position:absolute;left:0;right:0;top:46%;text-align:center;color:#fff;font-weight:800;font-size:22px;letter-spacing:.3px;opacity:0;animation:wtfade 1.5s forwards}
@keyframes wvsweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes wtfade{0%,25%{opacity:0}45%,60%{opacity:1}85%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.wave{display:none}}
.tblw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);white-space:nowrap}.pill.ok{background:rgba(34,197,94,.18);color:#16a34a}.pill.bad{background:rgba(220,38,38,.16);color:#dc2626}.pill.warn{background:rgba(245,158,11,.2);color:#b45309}
/* ===== Desktop software layout (tablet and desktop only) ===== */
body{padding-bottom:0}
body.mobile:not(.admin) .top{max-width:none;padding:10px 24px}
body.mobile .renew{max-width:none}
body.mobile:not(.guest):not(.admin) .shell{max-width:1440px;display:grid;grid-template-columns:240px minmax(0,1fr);border-inline:0;min-height:calc(100vh - 62px)}
body.mobile:not(.guest):not(.admin) nav{position:sticky;top:64px;left:auto;bottom:auto;transform:none;width:auto;height:calc(100vh - 62px);flex-direction:column;justify-content:flex-start;gap:4px;padding:14px 12px;border-top:0;border-right:1px solid var(--line);overflow-y:auto}
body.mobile:not(.guest):not(.admin) nav button{flex-direction:row;font-size:15px;padding:12px 14px;border-radius:12px;gap:12px;text-align:left}
body.mobile:not(.guest):not(.admin) nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
body.mobile:not(.guest):not(.admin) main{padding:26px 34px 48px;max-width:1180px}
body.mobile:not(.guest):not(.admin) .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
body.guest .shell{max-width:560px}
body.mobile:not(.guest):not(.admin) .clsg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
body.mobile:not(.guest):not(.admin) .clsg button{aspect-ratio:1.6}
@media (max-width:900px){body.mobile:not(.guest):not(.admin) .shell{grid-template-columns:200px minmax(0,1fr)}body.mobile:not(.guest):not(.admin) main{padding:20px 20px 40px}}
#sbar{position:fixed;left:0;right:0;bottom:0;height:30px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 18px;font-size:12px;color:var(--muted);background:var(--surface);border-top:1px solid var(--line);z-index:30}
#sbar span{display:inline-flex;align-items:center;gap:6px}#sbar .dot{width:8px;height:8px}
#devblock{position:fixed;inset:0;z-index:100000;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:28px;text-align:center}
#devblock .dbx{max-width:420px}#devblock .dbi{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
#devblock h1{font-size:26px;margin:0 0 10px}#devblock p{margin:6px 0;font-size:17px}#devblock .dbh{color:var(--muted);font-size:15px;margin-top:14px}
body.devblocked>*:not(#devblock){display:none!important}
.chip[hidden]{display:none}
.dk-time{font-size:68px;font-weight:800;text-align:center;letter-spacing:2px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.dk-modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.dk-bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0}.dk-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7a46e0);border-radius:99px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px;margin-top:8px}
.wk div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--muted)}
.wk i{display:block;width:100%;max-width:38px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#7a46e0,var(--brand));min-height:4px}.wk b{color:var(--text);font-size:12px;margin-bottom:3px}
.tk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.tk.done span{text-decoration:line-through;color:var(--muted)}.tk span{flex:1;word-break:break-word}
.tk input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
.dk-add{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.dk-add input,.dk-add textarea{flex:1;min-width:130px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:inherit;color:inherit}
.dk-note{padding:12px;border-radius:14px;background:var(--surface2);margin-bottom:8px}.dk-note p{white-space:pre-wrap;margin:4px 0 8px}
.dk-left{padding:2px 10px;border-radius:99px;font-weight:700;font-size:12px;background:rgba(63,81,217,.14);color:var(--brand)}.dk-left.soon{background:rgba(245,158,11,.2);color:#b45309}
.askb,.askp{display:none!important}
.who{padding:4px 12px;border-radius:999px;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#fff}
.who.adm{background:linear-gradient(120deg,#7c3aed,#c026d3)}.who.stu{background:linear-gradient(120deg,#2563eb,#3f51d9)}.who.log{background:#64748b}
.hpath .pg{font-weight:700;font-size:15px}
.od{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa0a6;margin:0 4px 0 2px}.od.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.phead{background:linear-gradient(120deg,var(--brand),#7a46e0 70%,#b43fd0);color:var(--brand-ink);border-radius:20px;padding:22px 28px;margin-bottom:18px;box-shadow:0 14px 34px rgba(63,81,217,.26);position:relative;overflow:hidden}
.phead::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.phead h1{margin:0;font-size:26px}.phead p{margin:4px 0 0;opacity:.92}
.abrand{display:flex;align-items:center;gap:10px;padding:10px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.abrand .ib{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}.abrand b{display:block}.abrand small{color:var(--muted)}
.adm-nav button[aria-current="page"]{background:linear-gradient(120deg,var(--brand),#7a46e0);box-shadow:0 8px 18px rgba(63,81,217,.3)}
.adm-nav button:not([aria-current="page"]):hover{background:var(--surface2)}
.card.stat{border-top:3px solid var(--brand);transition:transform .15s,box-shadow .15s}.card.stat b{font-size:30px}.card.stat:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(63,81,217,.16)}
.tbl th{text-transform:uppercase;font-size:11px;letter-spacing:.6px}.tbl tbody tr:hover{background:var(--surface2)}
.ucard{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface2)}
.ucard .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(120deg,var(--brand),#7a46e0);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none}
.ucard b{display:block;line-height:1.2}.ucard small{color:var(--muted)}
.login .lhero{position:relative;overflow:hidden}
.login .lhero::before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.1)}
.login .lhero::after{content:"";position:absolute;left:-90px;bottom:-130px;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.08)}
.login .lhero>*{position:relative;z-index:1}
/* ===== Fresh desktop look ===== */
body.mobile .card{box-shadow:0 1px 2px rgba(20,24,60,.04),0 8px 22px rgba(20,24,60,.05);transition:box-shadow .2s,transform .2s,border-color .2s}
body.mobile:not(.admin) .top{position:sticky;top:0;z-index:35;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line),0 6px 20px rgba(20,24,60,.05)}
body.mobile:not(.guest):not(.admin) nav{background:var(--surface)}
body.mobile:not(.guest):not(.admin) nav button{transition:background .15s,color .15s}
body.mobile:not(.guest):not(.admin) nav button:not([aria-current="page"]):hover{background:var(--surface2);color:var(--text)}
body.mobile:not(.guest):not(.admin) nav button[aria-current="page"]{box-shadow:0 6px 16px rgba(63,81,217,.28)}
.clsg button{transition:transform .15s,box-shadow .15s,border-color .15s}
.clsg button:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 12px 26px rgba(63,81,217,.18)}
.whero{background:linear-gradient(120deg,var(--brand),#7a46e0);color:var(--brand-ink);border-radius:22px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:14px 0 20px;box-shadow:0 14px 34px rgba(63,81,217,.28)}
.whero h1{margin:0 0 4px;font-size:28px}.whero p{margin:0;opacity:.9;font-size:16px}
.wchips{display:flex;gap:10px;flex-wrap:wrap}.wchips span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);padding:9px 16px;border-radius:999px;font-weight:700}
/* login: full desktop page with two panels */
body.guest .shell{max-width:none;display:block;border-inline:0}
body.guest main{padding:0;max-width:none}
.login{margin:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:calc(100vh - 62px);background:var(--bg)}
.login .lhero{grid-row:1 / span 8;border-radius:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;padding:56px clamp(32px,6vw,96px);background:linear-gradient(145deg,var(--brand),#6a3fd9 60%,#8a4fe0)}
.login .lhero .ib{width:76px;height:76px;margin:0 0 22px;border-radius:22px}
.login .lhero h1{font-size:clamp(30px,3.4vw,46px);margin:0 0 8px}
.login .lhero .ltag{font-size:18px;margin-bottom:26px}
.lfeat{list-style:none;margin:0;padding:0;display:grid;gap:14px}.lfeat li{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600}.lfeat li svg{flex:none;background:rgba(255,255,255,.2);border-radius:50%;padding:4px;width:26px;height:26px;box-sizing:border-box}

.login .tabs{margin:0 0 16px}

#splash{position:fixed;inset:0;z-index:100001;background:linear-gradient(135deg,#3f51d9,#6a3fd9);color:#fff;display:grid;place-items:center;text-align:center;transition:opacity .5s}

body.standalone #instTop{display:none}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.swatch[aria-pressed="true"]{border-color:var(--text)}
body.admin .shell,body.admin .top{max-width:1280px}

body.admin main{padding:18px 22px 48px}
.adm-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
.adm-nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.adm-nav button{display:flex;align-items:center;gap:10px;padding:12px;border:0;border-radius:10px;background:none;color:var(--text);font-weight:600;text-align:left}

const NOTES = [
  {id:"n1", subj:"phy", t:{en:"Newton’s Laws of Motion"}, p:{en:["First law: a body stays at rest or in uniform motion unless an external force acts; this property is called {{inertia}}.","Second law: force = mass × {{acceleration}} (F = ma).","Third law: every action has an equal and {{opposite}} reaction.","The SI unit of force is the {{newton}}.","The greater the {{mass}} of a body, the greater its inertia."]}},
  {id:"n2", subj:"phy", t:{en:"Work, Energy and Power"}, p:{en:["Work = force × {{displacement}} (in the direction of the force).","The SI unit of work and energy is the {{joule}}.","Kinetic energy is the energy a body has because of its {{motion}}.","Power is the {{rate}} of doing work; its unit is the watt.","Energy can neither be created nor {{destroyed}}; it only changes form."]}},
  {id:"n3", subj:"phy", t:{en:"Gravitation"}, p:{en:["Gravitation is the {{attraction}} between any two objects.","The acceleration due to gravity, g, is about {{9.8}} m/s² on Earth.","As the distance between two objects increases, the gravitational force {{decreases}}.","The {{weight}} of a body changes from place to place, but its mass does not.","On the Moon, g is about one-{{sixth}} of Earth’s g."]}},
  {id:"n4", subj:"chem", t:{en:"Atomic Structure"}, p:{en:["At the centre of an atom lies the {{nucleus}}.","The nucleus contains protons and {{neutrons}}.","{{Electrons}} carry negative charge and move around the nucleus.","The atomic number is the number of {{protons}} in an atom.","Mass number = protons + {{neutrons}}."]}},
  {id:"n5", subj:"chem", t:{en:"The Periodic Table"}, p:{en:["Elements in the periodic table are arranged by {{atomic number}}.","Horizontal rows are called {{periods}}.","Vertical columns are called {{groups}}.","Atomic radius {{decreases}} from left to right across a period.","The most electronegative element is {{fluorine}}."]}},
  {id:"n6", subj:"chem", t:{en:"Acids, Bases and Salts"}, p:{en:["Acids taste {{sour}}.","Acids turn blue litmus {{red}}.","A solution with a pH below 7 is {{acidic}}.","The reaction between an acid and a base is called {{neutralisation}}.","The chemical name of common salt is {{sodium chloride}}."]}},
  {id:"n7", subj:"bio", t:{en:"The Cell"}, p:{en:["The cell is the basic {{unit}} of life.","The {{nucleus}} contains the DNA.","{{Mitochondria}} are called the powerhouse of the cell.","Proteins are made on {{ribosomes}}.","Plant cells have a cell wall and {{chloroplasts}}."]}},
  {id:"n8", subj:"bio", t:{en:"Human Digestive System"}, p:{en:["Digestion of food begins in the {{mouth}}.","The enzyme {{amylase}} in saliva breaks down starch.","Most digestion and absorption happens in the {{small intestine}}.","The {{liver}} makes bile.","Most water is absorbed in the {{large intestine}}."]}},
  {id:"n9", subj:"bio", t:{en:"Heredity"}, p:{en:["{{Gregor Mendel}} is known as the father of genetics.","Mendel carried out his experiments on {{pea}} plants.","A unit of heredity on a chromosome is called a {{gene}}.","Humans have {{23}} pairs of chromosomes.","DNA has a {{double helix}} shape."]}},
  {id:"n10", subj:"gen", t:{en:"States of Matter"}, p:{en:["The three main states of matter are solid, liquid and {{gas}}.","A solid has a fixed shape and fixed {{volume}}.","A liquid takes the {{shape}} of its container.","The change of a solid directly into a gas is called {{sublimation}}.","At normal pressure, water boils at {{100}} °C."]}},
  {id:"n11", subj:"gen", t:{en:"Light and Sound"}, p:{en:["The speed of light in a vacuum is about {{3×10⁸}} m/s.","The bouncing back of light from a surface is {{reflection}}.","Sound needs a {{medium}} to travel.","The unit of frequency is the {{hertz}}.","The return of sound after reflection is called an {{echo}}."]}},
  {id:"n12", subj:"gen", t:{en:"The Solar System"}, p:{en:["The {{Sun}} is at the centre of the solar system.","The planet closest to the Sun is {{Mercury}}.","The largest planet is {{Jupiter}}.","The Moon is Earth’s only natural {{satellite}}.","Earth takes about {{365}} days to orbit the Sun."]}},
  {id:"n13", subj:"math", t:{en:"Algebra Basics"}, p:{en:["A letter that stands for an unknown number is called a {{variable}}.","An {{equation}} says that two expressions are equal.","To solve an equation, do the same operation on {{both sides}}.","In (a + b)², the middle term is {{2ab}}.","The value of a variable that makes an equation true is its {{solution}}."]}},
  {id:"n14", subj:"math", t:{en:"Geometry and Mensuration"}, p:{en:["The sum of the angles of a triangle is {{180}} degrees.","In a right-angled triangle, the square of the {{hypotenuse}} equals the sum of the squares of the other two sides.","The area of a circle is π times the square of its {{radius}}.","The distance around a circle is called its {{circumference}}.","The area of a rectangle is length × {{breadth}}."]}},
  {id:"n15", subj:"cs", t:{en:"Computer Basics"}, p:{en:["The {{CPU}} is called the brain of the computer.","{{RAM}} is the temporary memory used while programs are running.","A {{bit}} is the smallest unit of data; 8 bits make a byte.","{{Software}} is the set of programs that tells the hardware what to do.","A keyboard and a mouse are {{input}} devices."]}},
  {id:"n16", subj:"cs", t:{en:"Internet and Online Safety"}, p:{en:["A {{browser}} is software used to open websites.","A strong password mixes letters, numbers and {{symbols}}.","Never share your {{OTP}} with anyone.","{{Phishing}} tricks people into giving away personal details through fake messages or sites.","A website address that starts with {{HTTPS}} uses an encrypted connection."]}},
  {id:"n17", subj:"evs", t:{en:"Ecosystem and Food Chain"}, p:{en:["Plants are called {{producers}} because they make their own food.","Animals that eat only plants are called {{herbivores}}.","{{Decomposers}} break down dead plants and animals.","The main source of energy for almost every ecosystem is the {{Sun}}.","A food {{web}} is a network of many connected food chains."]}},
  {id:"n18", subj:"evs", t:{en:"Pollution and Conservation"}, p:{en:["Burning fossil fuels releases {{carbon dioxide}}, a greenhouse gas.","The ozone layer protects us from harmful {{ultraviolet}} rays.","The three Rs of waste are reduce, {{reuse}} and recycle.","Planting {{trees}} helps reduce carbon dioxide in the air.","Using water carefully and avoiding waste is called {{water conservation}}."]}},

const MARKS = 4;                 /* marks for each correct answer */
const LEADERBOARD_URL = "";      /* optional: your server returns a JSON list like [{"name":"Asha","points":120}] */
const SCORE_URL = "";            /* optional: your server receives every result (POST JSON) */
const SAMPLE_BOARD = [{name:"Aarav S.",points:156},{name:"Diya M.",points:140},{name:"Kabir R.",points:124},{name:"Ananya P.",points:108},{name:"Rohan T.",points:92},
  {name:"Isha K.",points:76},{name:"Vihaan G.",points:60},{name:"Meera D.",points:44},{name:"Arjun N.",points:28},{name:"Saanvi L.",points:12}];
let board = SAMPLE_BOARD.slice(), liveBoard = false, nTab = "phy", noteOpen = null, quiz = null;

const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const termOf = (t) => { const m = t.match(/\{\{(.+?)\}\}/); return m ? m[1] : null; };
const noteHtml = (t) => esc(t).replace(/\{\{(.+?)\}\}/g, '<b class="kt">$1</b>');
const maxFor = (n) => Math.min(5, nt(n).p.filter(termOf).length) * MARKS;
const totalPoints = () => NOTES.reduce((a, n) => a + (S.best[n.id] || 0), 0);
const TIERS = [[180, "Platinum"], [120, "Gold"], [60, "Silver"], [20, "Bronze"], [0, "Starter"]];
const tier = () => TIERS.find((t) => totalPoints() >= t[0])[1];
function rows(){
  const me = {name:S.user.name, points:totalPoints(), me:true};
  return board.concat([me]).sort((a, b) => b.points - a.points || (a.me ? 1 : 0) - (b.me ? 1 : 0));
}
const myRank = () => rows().findIndex((r) => r.me) + 1;

/* Question maker: every key term in a note becomes a fill-in-the-blank with 4 options.
   Wrong options come from other notes of the same subject, so each attempt gives a fresh mix. */
function makeQuiz(n){
  const pool = Array.from(new Set(NOTES.filter((x) => x.subj === n.subj).flatMap((x) => nt(x).p.map(termOf)).filter(Boolean)));
  const qs = nt(n).p.filter(termOf).map((t) => {
    const ans = termOf(t);
    const num = /^\d+$/.test(ans); let cand = pool.filter((x) => x !== ans && /^\d+$/.test(x) === num); if (cand.length < 3) cand = pool.filter((x) => x !== ans);
    const opts = shuffle([ans].concat(shuffle(cand).slice(0, 3)));
    return {text:t.replace(/\{\{.+?\}\}/, "_____").replace(/\{\{(.+?)\}\}/g, "$1"), opts:opts, ans:ans};
  });
  return {note:n, qs:shuffle(qs).slice(0, 5), pick:{}, done:false, res:null};
}
function submitQuiz(){
  const q = quiz, id = q.note.id, correct = q.qs.filter((x, i) => q.pick[i] === x.ans).length, marks = correct * MARKS;
  const prev = S.best[id] || 0, rankBefore = myRank();
  S.best[id] = Math.max(marks, prev);
  q.done = true; q.res = {correct:correct, marks:marks, max:q.qs.length * MARKS, newBest:marks > prev, rankBefore:rankBefore, rankAfter:myRank()};
  markActive(); save();
  if (SCORE_URL) { try { fetch(SCORE_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user:S.user.contact, note:id, marks:marks, points:totalPoints()})}); } catch (e) {} }
  render();
}

function vQuiz(){
  const q = quiz, r = q.res;
  const cards = q.qs.map((x, i) => '<div class="card" style="margin-bottom:12px"><b>Q' + (i + 1) + '.</b> ' + esc(x.text) + '<div class="opts">' +
    x.opts.map((o) => {
      let c = "opt";
      if (q.done) { if (o === x.ans) c += " ok"; else if (q.pick[i] === o) c += " bad"; } else if (q.pick[i] === o) c += " sel";
      return '<button class="' + c + '" data-q="' + i + '" data-o="' + esc(o) + '"' + (q.done ? " disabled" : "") + '>' + esc(o) + '</button>';
    }).join("") + '</div></div>').join("");
  const top = r ? '<div class="card" style="text-align:center;margin-bottom:12px"><div class="coins" style="justify-content:center">' + ic("trophy", 30) + '<span>' + r.marks + ' / ' + r.max + '</span></div>' +

function vRank(){

const tierOf = (p) => TIERS.find((t) => p >= t[0])[1];
function playerBox(i){
  const all = rows(), r = all[i]; if (!r) return;
  const pts = r.points, k = TIERS.findIndex((t) => pts >= t[0]), nextLv = k > 0 ? TIERS[k - 1] : null, maxPts = NOTES.reduce((a, n) => a + maxFor(n), 0);
  const cell = (v, l) => '<div class="card stat"><b>' + v + '</b><span>' + l + '</span></div>';
  const mine = totalPoints(), diff = pts - mine;
  let cells = cell("#" + (i + 1), "Rank of " + all.length) + cell(pts, "Points") + cell(tierOf(pts), "Level") + cell(Math.round(100 * pts / maxPts) + "%", "Of all points") +
    cell(i > 0 ? all[i - 1].points - pts : 0, i > 0 ? "Points to next rank" : "Top of the board") + cell(nextLv ? nextLv[0] - pts : 0, nextLv ? "Points to next level" : "Top level");
  if (r.me) { const m = masteryStats(); cells += cell(Object.keys(S.best).length + "/" + NOTES.length, "Notes attempted") + cell(m.mastered + "/" + m.notes, "Notes mastered") + cell(S.streak, "Day streak") + cell(totalPct() + "%", "Chapters done"); }
  else { if (Number.isFinite(r.streak)) cells += cell(r.streak, "Day streak"); if (Number.isFinite(r.notes)) cells += cell(r.notes, "Notes mastered"); }
  const note = r.me ? "This is you." : (diff === 0 ? "Level with you." : diff > 0 ? diff + " points ahead of you." : -diff + " points behind you.");
  $("#sheet").innerHTML = '<div style="display:flex;gap:14px;align-items:center"><span class="av" style="width:64px;height:64px;font-size:28px">' + esc(r.name.charAt(0).toUpperCase()) + '</span><div><h2 id="vt" style="margin:0">' + esc(r.name) + '</h2><p class="sub" style="margin:2px 0 0">' + note + (!r.me && !liveBoard ? " (sample player)" : "") + '</p></div></div>' +
    '<div class="grid two" style="margin-top:14px">' + cells + '</div><div class="row"><button class="go" id="no">Close</button></div>';
  $("#veil").classList.add("show"); $("#no").onclick = closeUp;
}

/* Crop an image to w x h (or, when h is 0, shrink it to at most w wide) and return a JPEG data URL */
function pickImage(file, w, h, cb){
  if (!file || !/^image\//.test(file.type)) { toast("Please choose an image."); return; }
  if (file.size > 12 * 1024 * 1024) { toast("That image is too large (max 12 MB)."); return; }
  const rd = new FileReader();
  rd.onload = () => { const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas"), g = c.getContext("2d");
      if (h) { c.width = w; c.height = h; const k = Math.max(w / im.width, h / im.height), sw = w / k, sh = h / k; g.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, 0, 0, w, h); }
      else { const k = Math.min(1, w / im.width); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); g.drawImage(im, 0, 0, c.width, c.height); }
      cb(c.toDataURL("image/jpeg", .8));
    };
    im.onerror = () => toast("Could not read that image."); im.src = rd.result; };
  rd.readAsDataURL(file);
}

/* "Coming Zone" boards: the text types out, stays, is deleted, and types again (each board a little out of step) */
function startCz(){
  clearInterval(czTimer);
  const els = Array.from(document.querySelectorAll(".cz")); if (!els.length) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { els.forEach((e) => { e.textContent = CZ_TEXT; }); return; }
  const L = CZ_TEXT.length, cycle = L + 10 + L + 4; let tick = 0;
  czTimer = setInterval(() => {
    tick++;
    if (!els[0].isConnected) { clearInterval(czTimer); return; }
    els.forEach((e, i) => {
      const p = (tick + i * 3) % cycle;
      e.textContent = p < L ? CZ_TEXT.slice(0, p + 1) : p < L + 10 ? CZ_TEXT : p < 2 * L + 10 ? CZ_TEXT.slice(0, 2 * L + 9 - p) : "";
    });
  }, 110);
}
function bindWallet(){
  startCz();
  const b = $("#vcb"); if (!b) return;
  b.onclick = async () => {
    const n = Math.floor(Number($("#vcn").value));
    if (!(n >= 1)) { toast("Enter how many coins."); return; }
    if (n > wallet.get()) { toast("Not enough coins."); return; }
    try {
      const r = await fetch(VOUCHER_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({phone:S.user.contact, coins:n})});
      const j = await r.json(); if (!r.ok || j.ok !== true || typeof j.code !== "string") throw new Error("not issued");
      wallet.set(wallet.get() - n, "Voucher created"); S.vouchers.unshift({code:j.code.slice(0, 40), coins:n, t:Date.now()}); save(); render(); toast("Voucher created.");
    } catch (e) { toast("Could not create the voucher. Your coins were not used."); }
  };
}

let rcAmt = 10;
const rcOk = (n) => Number.isInteger(n) && n >= RC_MIN && n <= RC_MAX;
function coinLink(n){ return "upi://pay?pa=" + encodeURIComponent(UPI.user + "@" + UPI.bank) + "&pn=" + encodeURIComponent("Khatu Universal") + "&am=" + n + "&cu=INR&tn=" + encodeURIComponent("Khatu Coins " + n); }
function qrCoin(n){
  const e = QRC[n]; if (!e) return "";
  const bin = atob(e[1]), N = e[0]; let bits = "", rows = [];
  for (let i = 0; i < bin.length; i++) bits += bin.charCodeAt(i).toString(2).padStart(8, "0");
  for (let r = 0; r < N; r++) rows.push(bits.slice(r * N, (r + 1) * N));
  return qrSvg(0, rows);
}
function vRecharge(){
  const n = rcAmt, ok = rcOk(n);

  const head = '<button class="chip" id="rb">' + T("Back") + '</button><h1 style="margin-top:12px">Recharge coins</h1><p class="sub">You get ' + COIN_PER_RUPEE + ' coin for every \u20b91. Recharge \u20b9' + RC_MIN + ' to \u20b9' + RC_MAX + ' at a time. Coins stay in this app and cannot be withdrawn.</p>' +
   '<div class="tabs" role="group" aria-label="Amount">' + RC_QUICK.map((x) => '<button data-rc="' + x + '" aria-pressed="' + (x === n) + '">\u20b9' + x + '</button>').join("") + '</div>' +

   '<h2><span class="stp">1</span>Pay</h2><div class="card"><p style="margin:0 0 10px">Paying to <b>KHATU STUDY LAB</b> · UPI ' + maskedUpi() + '</p><button class="btn" id="paynow" style="margin-top:0">Pay Now \u20b9' + n + '</button><p class="sub" style="font-size:12px;margin:8px 0 0">Opens your UPI app. If nothing opens, scan the QR below.</p></div>' +
   '<h2>Or scan to pay</h2><div class="card" style="text-align:center">' + qrCoin(n) + '<p class="sub" style="font-size:12px;margin:10px 0 0">Scan with any UPI app. The amount \u20b9' + n + ' is already filled in.</p></div>' +
   '<h2><span class="stp">2</span>Verify your payment</h2><div class="card">' + demo + '<p class="sub" style="margin:0">After paying, enter the 12-digit UTR (UPI reference number) from your payment app.</p>' +

}
async function verifyRechargeNow(){
  const err = (m) => { $("#uerr").textContent = m; }, utr = String($("#utr").value).replace(/\s+/g, ""), n = rcAmt;
  err(""); if (!rcOk(n)) return err("Choose an amount from \u20b9" + RC_MIN + " to \u20b9" + RC_MAX + ".");
  const bad = await checkUtr(utr, n, "coins"); if (bad) return err(bad);
  const coins = n * COIN_PER_RUPEE;
  if (UTR_VERIFY_URL || utr !== DEMO_UTR) { S.utrs = (S.utrs || []).concat(utr).slice(-50); save(); }
  wallet.set(wallet.get() + coins, "Coin recharge (\u20b9" + n + ")");
  $("#sheet").innerHTML = '<div style="text-align:center"><div class="ib" style="margin:0 auto 10px;width:64px;height:64px">' + ic("coin", 36) + '</div><h2 id="vt" style="margin:0 0 6px">Congratulations!</h2><p style="margin:0 0 4px">Your \u20b9' + n + ' recharge is done.</p>' +
   '<p class="sub" style="margin:0">+' + coins + ' coins added · balance ' + wallet.get() + ' coins</p></div><div class="row"><button id="no">Recharge again</button><button class="go" id="yes">Open wallet</button></div>';
  $("#veil").classList.add("show"); $("#yes").onclick = () => { closeUp(); go("wallet"); }; $("#no").onclick = () => { closeUp(); render(); };
}
const verifyRecharge = () => lockUtr(verifyRechargeNow);
function bindRecharge(){
  $("#rb").onclick = () => go("wallet");
  document.querySelectorAll("[data-rc]").forEach((b) => b.onclick = () => { rcAmt = +b.dataset.rc; render(); });
  const ra = $("#ramt"); if (ra) ra.onchange = () => { const v = Number(ra.value); if (!rcOk(v)) { $("#rerr").textContent = "Enter a whole amount from \u20b9" + RC_MIN + " to \u20b9" + RC_MAX + "."; return; } rcAmt = v; render(); };
  const pn = $("#paynow"); if (pn) pn.onclick = () => { location.href = coinLink(rcAmt); };
  const vb = $("#vrc"); if (vb) { vb.onclick = verifyRecharge; $("#utr").onkeydown = (e) => { if (e.key === "Enter") verifyRecharge(); }; }
}
/* ================= RENEWAL REMINDER: shown when a plan is about to end (or has ended) ================= */
const RENEW_DAYS = 3;   /* start warning this many days before the plan ends */
function renewState(){
  const s = S.sub && S.user && S.sub.phone === S.user.contact ? S.sub : null; if (!s) return null;
  const left = s.until - Date.now();
  if (left <= 0) return {expired:true, days:0};
  return left <= RENEW_DAYS * 864e5 ? {expired:false, days:Math.ceil(left / 864e5)} : null;
}
function checkRenew(){
  const b = $("#renew"); if (!b) return;
  const st = S.user ? renewState() : null, today = new Date().toDateString();
  if (!st) { b.hidden = true; return; }
  const txt = st.expired ? "Your plan has ended. Please renew." : "Your plan is about to expire. Please renew." + (st.days ? " (" + st.days + " day" + (st.days > 1 ? "s" : "") + " left)" : "");
  $("#renewTxt").textContent = txt; b.hidden = S.renewHide === today;
  $("#renewGo").onclick = () => { payStep = "plans"; go("pay"); };
  $("#renewX").onclick = () => { S.renewHide = today; save(); b.hidden = true; };
  if (window.Notification && Notification.permission === "granted" && S.warned !== today) {   /* one phone notification a day, only if the person allowed it */
    S.warned = today; save(); try { new Notification("Khatu Lab", {body:txt}); } catch (e) {}
  }
}
function reminderHtml(){
  if (!window.Notification) return "";
  const st = Notification.permission;
  return '<div class="card" style="margin-top:14px"><b>Expiry reminders</b><p class="sub" style="margin:4px 0 8px">' + (st === "granted" ? "On. You will be told when your plan is about to end." : st === "denied" ? "Blocked in your browser settings. Allow notifications for this site to turn them on." : "Get a notification when your plan is about to end.") + '</p>' +
    (st === "default" ? '<button class="chip go" id="rem">Turn on reminders</button>' : "") + '</div>';
}

const HELV = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];

const pdfClean = (s) => String(s).replace(/[^\x20-\x7e\n]/g, (ch) => PDF_MAP[ch] !== undefined ? PDF_MAP[ch] : "");
function buildPdf(title, subtitle, blocks){

    const out = []; let ln = "";
    s.split(/\s+/).filter(Boolean).forEach((w) => {
      while (tw(w, size, bold) > width) { let k = w.length - 1; while (k > 1 && tw(w.slice(0, k), size, bold) > width) k--; if (ln) { out.push(ln); ln = ""; } out.push(w.slice(0, k)); w = w.slice(k); }
      const t = ln ? ln + " " + w : w; if (tw(t, size, bold) <= width || !ln) ln = t; else { out.push(ln); ln = w; }
    });
    if (ln) out.push(ln); return out;
  };
  const pages = []; let ops, y;

  const esc2 = (t) => t.replace(/[\\()]/g, "\\$&");
  const put = (t, x, size, bold) => { ops.push("BT /F" + (bold ? 2 : 1) + " " + size + " Tf " + x.toFixed(1) + " " + y.toFixed(1) + " Td (" + esc2(t) + ") Tj ET"); };

  const para = (t, x, size, bold, lead, width) => wrap(t, size, bold, width).forEach((l) => line(l, x, size, bold, lead));
  newPage(); para(pdfClean(title), M, 20, true, 26, W); line(pdfClean(subtitle), M, 10, false, 16); y -= 6;
  blocks.forEach((b) => {
    if (b.t === "h") { y -= 8; para(pdfClean(b.s), M, 14, true, 20, W); }
    else if (b.t === "li") { wrap(pdfClean(b.s), 11, false, W - 16).forEach((l, i) => { line(l, M + 14, 11, false, 15); if (i === 0) put("-", M + 2, 11, false); }); y -= 2; }
    else if (b.t === "q") { para("Q: " + pdfClean(b.q), M, 11, true, 15, W); para("A: " + pdfClean(b.a), M + 14, 11, false, 15, W - 14); y -= 6; }
    else { para(pdfClean(b.s), M, 11, false, 15, W); y -= 4; }
  });
  const n = pages.length; pages.forEach((p, i) => { ops = p; y = 30; put(NAME_FOOT, M, 9, false); const t = "Page " + (i + 1) + " of " + n; y = 30; put(t, PW - M - tw(t, 9, false), 9, false); });
  const objs = [null, "<< /Type /Catalog /Pages 2 0 R >>", "<< /Type /Pages /Kids [" + pages.map((_, i) => (5 + 2 * i) + " 0 R").join(" ") + "] /Count " + n + " >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>", "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  pages.forEach((p, i) => { const st = p.join("\n"); objs[5 + 2 * i] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + (6 + 2 * i) + " 0 R >>"; objs[6 + 2 * i] = "<< /Length " + st.length + " >>\nstream\n" + st + "\nendstream"; });

  const xr = out.length; out += "xref\n0 " + objs.length + "\n0000000000 65535 f \n" + offs.slice(1).map((o) => String(o).padStart(10, "0") + " 00000 n \n").join("") + "trailer\n<< /Size " + objs.length + " /Root 1 0 R >>\nstartxref\n" + xr + "\n%%EOF";

/* Understand a typed request such as "class 9 science notes" or "11 commerce accountancy questions" */
function parsePdfRequest(q){

  let k = (SUBS.find((x) => x[1].test(t)) || [])[0] || "";
  const what = /q\s*&?\s*a\b|question|important/.test(t) ? "qa" : /syllabus|chapter|index/.test(t) ? "syl" : /everything|full|complete|\ball\b/.test(t) ? "all" : "not";
  const noise = new Set("make create generate give need want please class notes note pdf for the and of on about with from my a an to in me full complete everything all questions question important syllabus chapter chapters index answers answer q&a qa arts art commerce bio science social english maths math mathematics physics chemistry biology accountancy business studies economics geography history political informatics practices computer".split(" "));
  const topic = (t.match(/[a-z]+/g) || []).filter((w) => w.length > 3 && !noise.has(w) && !/^\d/.test(w));
  if (!k && !topic.length && sub) { k = sub.k; c = cm ? c : sub.c; }
  let g = "gen";
  if (k) {
    if (c <= 10) { g = "gen"; if (["phy", "chem", "bio"].indexOf(k) >= 0) k = "sci"; if (k === "cmath") k = "math"; }
    else { const gs = groupsOf(c).filter((x) => GROUPS[x].subs.indexOf(k) >= 0 || (k === "math" && GROUPS[x].subs.indexOf("cmath") >= 0)); const pick = gs.find((x) => x === stream) || gs.find((x) => x === grp) || gs[0]; if (!pick) k = ""; else { g = pick; if (k === "math" && g === "commerce") k = "cmath"; } }
    if (k && c <= 10 && GROUPS.gen.subs.indexOf(k) < 0) k = "";
  }
  return {c:c, g:g, k:k, what:what, topic:topic.join(" ")};
}
function parseAiBlocks(text){
  let title = "Study notes"; const bl = [];
  text.split("\n").map((l) => l.trim()).filter(Boolean).forEach((l) => {
    if (/^#\s/.test(l) && title === "Study notes") title = l.replace(/^#\s+/, ""); else if (/^#{1,3}\s/.test(l)) bl.push({t:"h", s:l.replace(/^#+\s+/, "")}); else if (/^[-*•]\s/.test(l)) bl.push({t:"li", s:l.replace(/^[-*•]\s+/, "")}); else bl.push({t:"p", s:l});
  });
  return {title:title, bl:bl};
}
async function pdfFromRequest(q){
  const r = parsePdfRequest(q);
  if (r.k && !r.topic) { const m = await makePdfFor(r.c, r.g, r.k, r.what); return {ok:/ready/.test(m), msg:m}; }
  const prompt = "Write a short study handout for Class " + r.c + " students on: " + q.replace(/\bpdf\b/ig, "").trim() + ". Use plain English only. First line: # Title. Then sections with ## Heading and bullet lines starting with '- '. Keep it under 450 words. End with 4 practice questions, each with a one-line answer.";
  const text = await aiText([{role:"user", content:prompt}], null, null);
  let title, bl;
  if (text) { const p = parseAiBlocks(text); title = p.title; bl = p.bl; }
  else {
    const found = offlineAnswer(q);
    const tw = q.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 3 && w !== "pdf" && !/^(make|create|generate|give|need|want|please|about|class|notes|note|with|from|that|this|what|which)$/.test(w));
    const strong = tw.length > 0 && tw.filter((w) => found.toLowerCase().includes(w)).length >= Math.ceil(tw.length / 2);   /* only use the built-in notes when they really cover the topic */
    if (/^From the notes:/.test(found) && strong) { title = "Notes: " + tw.map((w) => w[0].toUpperCase() + w.slice(1)).join(" ").slice(0, 50); bl = found.split("\n").filter((l) => /^- /.test(l)).map((l) => ({t:"li", s:l.slice(2)})); }
    else return {ok:false, msg:"I could not make that PDF here because the AI is not connected on this device. Try a subject, like Class 9 Science notes."};
  }
  const bytes = buildPdf(title, NAME_FOOT + " · " + new Date().toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"}), bl);
  const s = await savePdf(fileSafe(title) + ".pdf", bytes);
  return {ok:s === "saved", msg:s === "saved" ? "Your PDF is ready: " + title + "." : "I made the PDF but this device would not save it."};
}
function pdfMakerHtml(){
  return '<div class="card"><b>Make a PDF</b><p class="sub" style="margin:4px 0 10px">Choose what you need. The PDF is made for you in a moment.</p><div class="tabs">' +
    [["not", "Notes"], ["syl", "Syllabus"], ["qa", "Q&A"], ["all", "Everything"]].map((x) => '<button data-mk="' + x[0] + '">' + x[1] + '</button>').join("") + '</div>' +
    '<label class="fld">Or tell me what PDF you need<input id="mkq" maxlength="200" placeholder="e.g. Class 9 science notes on motion"></label><button class="btn" id="mkgo">Make PDF</button><p class="sub" id="mkst" role="status" style="font-size:13px;margin:8px 0 0"></p></div>';
}
function bindPdfMaker(){
  document.querySelectorAll("[data-mk]").forEach((b) => b.onclick = async () => { $("#mkst").textContent = "Making your PDF…"; $("#mkst").textContent = await makePdfFor(sub.c, sub.g, sub.k, b.dataset.mk); });
  const go = $("#mkgo"); if (!go) return;
  go.onclick = async () => { const q = $("#mkq").value.trim(); if (!q) { $("#mkst").textContent = "Type what PDF you need."; return; } $("#mkst").textContent = "Making your PDF…"; $("#mkst").textContent = (await pdfFromRequest(/pdf/i.test(q) ? q : q + " pdf")).msg; };
}

applyTheme(); applyMode(); renderNav(); render(); loadBoard(); checkVersion(); loadPdfs();
initAsk(); updateAsk();
setInterval(checkRenew, 3600000); document.addEventListener("visibilitychange", () => { if (!document.hidden) checkRenew(); });

<script>
/* ===== Upgrade + Payment loop (from studylab-upgrade.html) ===== */
(function(){
  /* ===== SET THIS ===== */
  var PAY_URL = "https://YOUR-PAYMENT-SITE";   /* address of your KHATU STUDY LAB payment page */
  /* ==================== */
  var TOOL = "KHATU STUDY LAB";
  var PREM = "ku_premium", PEND = "ku_pending", WAL = "ku_wallet", DONE = "ku_activated";
  var FORMAT = /^KU\/01\/20\d{2}\/\d{4}$/;      /* required code format: KU/01/YEAR/NUMBER */
  function $(i){ return document.getElementById(i); }
  function get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function put(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function jget(k, f){ try { return JSON.parse(get(k)) || f; } catch(e){ return f; } }
  function fmt(t){ return new Date(t).toLocaleString("en-IN", {day:"numeric", month:"short", year:"numeric", hour:"numeric", minute:"2-digit"}); }
  function msg(t, ok){ var m = $("ku-msg"); m.textContent = t; m.className = "ku-msg " + (ok ? "ku-ok" : "ku-er"); }

  /* ---------- wallet (shows live everywhere) ---------- */
  function coins(){ return Number(get(WAL)) || 0; }
  function paint(pulse){
    var n = coins();
    [].forEach.call(document.querySelectorAll("[data-ku-coins]"), function(el){
      el.textContent = n;
      if (pulse) { el.classList.remove("ku-pulse"); void el.offsetWidth; el.classList.add("ku-pulse"); }
    });
  }
  function addCoin(){
    put(WAL, String(coins() + 1)); paint(true);
    document.dispatchEvent(new CustomEvent("ku-wallet-change", {detail:{coins:coins()}}));
  }
  window.addEventListener("storage", function(e){ if (e.key === WAL) paint(true); });   /* other tab updates live too */

  /* ---------- premium state ---------- */
  function state(){
    var d = jget(PREM, null); if (!d) return {active:false};
    var live = !d.expiry || d.expiry > Date.now();
    return {active:live, expired:!live, plan:d.plan, code:d.code, expiry:d.expiry || null};
  }
  function announce(){
    var s = state(); window.KU_PREMIUM = s;
    document.dispatchEvent(new CustomEvent("ku-premium-change", {detail:s}));
    var el = $("ku-status");
    if (s.active) el.textContent = "Premium active: " + s.plan + (s.expiry ? " until " + fmt(s.expiry) : "");
    else if (s.expired) el.textContent = "Your " + s.plan + " plan has expired. Please upgrade again.";
    else el.textContent = "Unlock all subjects with a Student Lab plan.";
  }

  /* ---------- 1. Upgrade button -> Payment Page ---------- */
  function upgrade(){
    if (PAY_URL.indexOf("YOUR-PAYMENT-SITE") > -1) { msg("The payment page address is not connected yet.", false); return; }
    var back = location.origin + location.pathname;
    location.href = PAY_URL.replace(/\/+$/, "") + "/?tool=" + encodeURIComponent(TOOL) + "&set=stud&return=" + encodeURIComponent(back);
  }

  /* ---------- 2. Back from payment: the payment page has generated the code ---------- */
  function readReturn(){
    var q = new URLSearchParams(location.search);
    if (q.get("status") !== "success") return;
    var code = (q.get("code") || "").toUpperCase(), exp = q.get("expiry");
    var expiry = exp && exp !== "lifetime" ? Number(exp) : null;
    if (FORMAT.test(code) && (expiry === null || isFinite(expiry))) {
      put(PEND, JSON.stringify({plan:q.get("plan") || "", amount:q.get("amount") || "", code:code, expiry:expiry}));
      $("ku-in").value = code;
      msg("Payment received. Tap Verify Code to activate your plan.", true);
    }
    ["status","plan","amount","code","expiry","tool","ref"].forEach(function(k){ q.delete(k); });
    var rest = q.toString();
    history.replaceState(null, "", location.pathname + (rest ? "?" + rest : "") + location.hash);
  }

  /* ---------- 3 + 4. Enter code -> pop-up + instant +1 coin ---------- */
  function popup(sub){
    $("ku-pop-sub").textContent = sub; $("ku-pop").classList.add("ku-show");
  }
  function verify(){
    var c = $("ku-in").value.trim().toUpperCase();
    if (!FORMAT.test(c)) { msg("Invalid code. The format is KU/01/2026/0001", false); return; }
    var pend = jget(PEND, null), cur = jget(PREM, null), src = null;
    if (pend && pend.code === c) src = pend; else if (cur && cur.code === c) src = cur;
    if (!src) { msg("This code was not issued for this device. Please pay through the Upgrade button.", false); return; }
    if (src.expiry && src.expiry <= Date.now()) { msg("This code has expired. Please upgrade again.", false); return; }
    put(PREM, JSON.stringify({plan:src.plan, amount:src.amount, code:c, expiry:src.expiry || null}));
    try { localStorage.removeItem(PEND); } catch(e){}
    var done = jget(DONE, []), first = done.indexOf(c) < 0;
    if (first) { done.push(c); put(DONE, JSON.stringify(done)); addCoin(); }   /* +1 coin, only once per code */
    announce(); msg("", true);
    popup(first ? "+1 Coin added to your wallet. Coins: " + coins() : "This code is already activated. Coins: " + coins());
  }

  $("ku-upgrade").addEventListener("click", upgrade);
  $("ku-verify").addEventListener("click", verify);
  $("ku-pop-ok").addEventListener("click", function(){ $("ku-pop").classList.remove("ku-show"); });
  window.KU = {upgrade:upgrade, verify:verify, state:state, coins:coins, addCoin:addCoin};
  /* In your app: KU_PREMIUM.active = plan is on. Show coins anywhere with <span data-ku-coins></span>. Listen: document.addEventListener("ku-wallet-change", ...) */
  readReturn(); announce(); paint(false);
  setInterval(announce, 60000);                                /* premium turns off by itself at the expiry time */
})();
</script>
